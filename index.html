<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Blog</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="header">
    <h1 class="title">Journey Junkies</h1>
    <p class="subtitle">Explore the world, one adventure at a time</p>
  </header>

  <main>
    <!-- Featured Destinations Section -->
    <section class="featured">
      <h2>Featured Destinations</h2>
      <div class="destinations">
        <div class="destination">
          <img src="./Paris.webp" alt="Paris">
          <h3>Paris, France</h3>
        </div>
        <div class="destination">
          <img src="./mal.jpg" alt="Maldives">
          <h3>Maldives</h3>
        </div>
        <div class="destination">
          <img src="./t.jpg" height="500" width="600" alt="Tokyo">
          <h3>Tokyo, Japan</h3>
        </div>
      </div>
    </section>

    <!-- Call to Action Section -->
    <section class="cta">
      <h2>Ready to start your journey?</h2>
      <p>Once the travel bug bites there is no known antidote.</p>
      <a href="#!" class="btn">Get Started</a>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; 2025 Journey Junkies. All rights reserved.</p>
  </footer>
</body>
</html>
